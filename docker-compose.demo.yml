# Demo overlay — extends docker-compose.yml with the orders-service and
# users-service upstreams and mounts the local certs/ tree into the gateway
# and the services.
#
# Usage:
#   bash scripts/gen-certs.sh
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml --env-file .env.demo up --build

services:
  gateway:
    env_file: .env.demo
    volumes:
      - ./certs:/app/certs:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      orders-service:
        condition: service_started
      users-service:
        condition: service_started

  orders-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
    command: node dist/microservices/orders-service/main-https.js
    environment:
      PORT: '8443'
      CERT_DIR: /app/certs
    volumes:
      - ./certs:/app/certs:ro
    expose:
      - '8443'
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
    command: node dist/microservices/users-service/main-https.js
    environment:
      PORT: '8443'
      CERT_DIR: /app/certs
    volumes:
      - ./certs:/app/certs:ro
    expose:
      - '8443'
    restart: unless-stopped
