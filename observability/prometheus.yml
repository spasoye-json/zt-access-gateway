global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zt-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']
        labels:
          service: zt-access-gateway

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
