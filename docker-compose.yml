version: '3.8'

# Minimal compose stack for Phase 1 (D-04).
# Only gateway and postgres. No microservices, no Prometheus, no Grafana.
# No init scripts or schema SQL (D-05) — migrations run at application start.

services:
  gateway:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # Override DATABASE_URL to use the compose service name — .env uses 'localhost'
      # which resolves to the container itself, not the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # No default — must be set in .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
