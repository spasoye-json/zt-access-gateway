# Full local stack for the Zero-Trust Access Gateway (issue #35).
#
#   gateway        — the NestJS zero-trust gateway (exposes /metrics)
#   postgres       — trust signals, audit WAL, MFA state
#   orders-service — sample downstream microservice (mTLS), proves the proxy path
#   certgen        — one-shot init that mints the demo PKI into the `certs` volume
#   prometheus     — scrapes gateway:/metrics
#   grafana        — provisioned datasource + security dashboard
#
# Usage:
#   cp .env.example .env   # then fill in the CHANGE_ME secrets
#   docker compose up --build
#
# Endpoints:
#   gateway     http://localhost:3000
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3001  (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
#
# mTLS note: the gateway's ProxyService always forwards over mTLS — there is no
# plaintext-HTTP path. The `certgen` service runs scripts/gen-certs.sh once at
# startup to mint a CA + gateway client cert + orders-service server cert into a
# shared `certs` volume, so the stack is fully runnable with a single command and
# no certificates are ever committed to git.

services:
  certgen:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache bash openssl >/dev/null &&
             CERT_DIR=/certs bash /scripts/gen-certs.sh orders-service"
    volumes:
      - certs:/certs
      - ./scripts:/scripts:ro
    restart: 'no'

  gateway:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # Override DATABASE_URL to use the compose service name — .env uses 'localhost'
      # which resolves to the container itself, not the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # mTLS paths inside the container; the `certs` volume is mounted at /app/certs.
      MTLS_CA_CERT_PATH: /app/certs/ca.crt
      MTLS_CLIENT_CERT_PATH: /app/certs/gateway.crt
      MTLS_CLIENT_KEY_PATH: /app/certs/gateway.key
      MTLS_ALLOWED_SUBJECTS: orders-service
      # Sample downstream registered in the SSRF allowlist. The service name
      # resolves to the orders-service compose service on the shared network.
      PROXY_SERVICE_REGISTRY: '{"orders":"https://orders-service:8443"}'
    volumes:
      - certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      certgen:
        condition: service_completed_successfully
      orders-service:
        condition: service_started
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
    command: node dist/microservices/orders-service/main-https.js
    environment:
      PORT: '8443'
      CERT_DIR: /app/certs
    volumes:
      - certs:/app/certs:ro
    expose:
      - '8443'
    depends_on:
      certgen:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # No default — must be set in .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  certs:
