version: '3.8'

# Minimal compose stack for Phase 1 (D-04).
# Only gateway and postgres. No microservices, no Prometheus, no Grafana.
# No init scripts or schema SQL (D-05) — migrations run at application start.

services:
  gateway:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # No default — must be set in .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
